server {
    listen 443 ssl;
    server_name app.m-motors.clickandgo-informatique.com;

    ssl_certificate /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/privkey.pem;

    root /var/www/public;
    index index.php;

    client_max_body_size 25M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
