# HTTP (port 80)
server {
    listen 80;
    server_name app.m-motors.clickandgo-informatique.com;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (port 443)
server {
    listen 443 ssl;
    server_name app.m-motors.clickandgo-informatique.com;

    # Certificats générés par Certbot
    ssl_certificate /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/privkey.pem;

    # Application Symfony
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # ACME challenge (nécessaire aussi en HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
