# HTTP
server {
    listen 80;
    server_name app.m-motors.clickandgo-informatique.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name app.m-motors.clickandgo-informatique.com;

    ssl_certificate /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/privkey.pem;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
