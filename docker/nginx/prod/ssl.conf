server {
    listen 443 ssl http2;
    server_name app.m-motors.clickandgo-informatique.com;

    # Racine Symfony
    root /var/www/public;
    index index.php;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Application Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
}

    # ACME challenge (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
