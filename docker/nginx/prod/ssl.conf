server {
    listen 80;
    server_name app.m-motors.clickandgo-informatique.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.m-motors.clickandgo-informatique.com;

    root /var/www/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.m-motors.clickandgo-informatique.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
