# yaml-language-server:
# $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: "../src/"
        exclude: "../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}"

    # Workflow dossier client
    workflow.dossier:
        class: Symfony\Component\Workflow\Workflow
        factory: ["@workflow.registry", "get"]
        arguments:
            - "dossier"

    Symfony\Component\Workflow\WorkflowInterface $dossierWorkflow:
        alias: workflow.dossier
