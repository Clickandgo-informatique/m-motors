parameters:
    dossier_upload_dir: "%kernel.project_dir%/public/uploads"

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $uploadDir: "%dossier_upload_dir%"

    # =========================================================
    # AUTOWIRE GLOBAL APP
    # =========================================================
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Migrations/"
            - "../src/Tests/"
            - "../src/Kernel.php"

    # =========================================================
    # SERVICES METIER
    # =========================================================
    App\Service\DossierDocumentUploadService: ~
    App\Service\DossierDocumentTypeResolver: ~

    # =========================================================
    # WORKFLOW GUARD
    # =========================================================
    App\Workflow\DossierWorkflowGuard:
        tags:
            - {
                name: kernel.event_listener,
                event: workflow.dossier.guard.submit_documents,
                method: guardSubmitDocuments
            }

    # IMPORTANT :
    # Aucun service pour DocumentUploadedListener ici
    # car on utilise un EventSubscriber autoconfiguré