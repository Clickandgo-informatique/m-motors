security:
    # Hashage des mots de passe
    # Symfony 7.4 recommande d'utiliser "auto", ce qui choisit l'algorithme le plus sécurisé disponible
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # Définition du provider utilisateur
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
                # On utilise l'email pour retrouver l'utilisateur

    firewalls:
        dev:
            # On désactive la sécurité pour ces routes de dev (profiler, wdt, assets, build)
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true # chargement paresseux pour améliorer les performances
            provider: app_user_provider
            custom_authenticators:
                # Authenticator pour le formulaire classique
                - App\Security\LoginFormAuthenticator
                # Authenticator pour Google OAuth
                - App\Security\GoogleAuthenticator

            logout:
                path: app_logout
                # target: app_any_route # optionnel pour rediriger après logout

            remember_me:
                secret: "%kernel.secret%" # nécessaire pour sécuriser le cookie
                lifetime: 604800 # durée du cookie en secondes (7 jours)
                path: /
                # always_remember_me: true # activer toujours la persistance si nécessaire

            # switch_user: true # Activer si besoin d'un mode impersonation/admin

    # Contrôles d'accès par rôle
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER } # exemple pour les pages utilisateurs

# Configuration spéciale pour les tests
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # réduit pour accélérer les tests
                time_cost: 3 # réduction pour Argon
                memory_cost: 10 # réduction pour Argon
