framework:
  workflows:
    dossier:
      type: state_machine

      marking_store:
        type: method
        property: status

      supports:
        - App\Entity\Dossier

      initial_marking: draft

      places:
        - draft
        - vehicle_selected
        - documents_pending
        - documents_review
        - financing_review
        - completed
        - cancelled

      transitions:

        select_vehicle:
          from: draft
          to: vehicle_selected

        request_documents:
          from: vehicle_selected
          to: documents_pending

        submit_documents:
          from: documents_pending
          to: documents_review

        validate_documents:
          from: documents_review
          to: financing_review

        reject_documents:
          from: documents_review
          to: documents_pending

        approve_financing:
          from: financing_review
          to: completed

        reject_financing:
          from: financing_review
          to: documents_review

        cancel:
          from:
            - draft
            - vehicle_selected
            - documents_pending
            - documents_review
            - financing_review
          to: cancelled
