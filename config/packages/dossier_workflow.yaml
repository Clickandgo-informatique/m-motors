framework:
  workflows:
    dossier:
      type: state_machine

      marking_store:
        type: method
        property: workflowStatus

      supports:
        - App\Entity\Dossier

      initial_marking: draft

      places:
        - draft
        - vehicle_selected
        - documents_pending
        - documents_review
        - financing_review
        - completed
        - cancelled

      transitions:
        select_vehicle:
          from: draft
          to: vehicle_selected

        request_documents:
          from: vehicle_selected
          to: documents_pending

        submit_documents:
          from: documents_pending
          to: documents_review

        validate_documents:
          from: documents_review
          to: financing_review

        complete:
          from: financing_review
          to: completed

        cancel_from_draft:
          from: draft
          to: cancelled

        cancel_from_vehicle:
          from: vehicle_selected
          to: cancelled

        cancel_from_documents:
          from:
            - documents_pending
            - documents_review
          to: cancelled

        cancel_from_financing:
          from: financing_review
          to: cancelled
