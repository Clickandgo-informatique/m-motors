framework:
  workflows:
    dossier:
      type: state_machine

      supports:
        - App\Entity\Dossier

      marking_store:
        type: method
        property: status

      initial_marking: draft

      places:
        - draft
        - vehicle_selected
        - documents_pending
        - documents_review
        - financing_review
        - order_signed
        - completed
        - cancelled

      transitions:
        select_vehicle:
          from: draft
          to: vehicle_selected
