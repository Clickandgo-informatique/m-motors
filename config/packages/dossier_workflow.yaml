framework:
  workflows:
    dossier:
      type: state_machine

      marking_store:
        type: method
        property: status

      supports:
        - App\Entity\Dossier

      initial_marking: draft

      places:
        - draft
        - vehicle_selected
        - documents_pending
        - documents_review
        - financing_review
        - completed
        - cancelled

      transitions:

        # =========================
        # VEHICLE SELECTION
        # =========================
        select_vehicle:
          from: draft
          to: vehicle_selected

        # véhicule réservé ici (IMPORTANT métier)
        request_documents:
          from: vehicle_selected
          to: documents_pending

        # =========================
        # DOCUMENTS FLOW
        # =========================
        submit_documents:
          from: documents_pending
          to: documents_review

        validate_documents:
          from: documents_review
          to: financing_review

        reject_documents:
          from: documents_review
          to: documents_pending

        # =========================
        # FINANCING (si applicable)
        # =========================
        approve_financing:
          from: financing_review
          to: completed

        reject_financing:
          from: financing_review
          to: documents_review

        # =========================
        # CANCEL (global)
        # =========================
        cancel_from_draft:
          from: draft
          to: cancelled

        cancel_from_vehicle:
          from: vehicle_selected
          to: cancelled

        cancel_from_documents:
          from:
            - documents_pending
            - documents_review
          to: cancelled

        cancel_from_financing:
          from: financing_review
          to: cancelled
