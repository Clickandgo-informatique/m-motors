doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"
        #server_version: '16'
        profiling_collect_backtrace: "%kernel.debug%"

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true

        dql:
            datetime_functions:
                YEAR: DoctrineExtensions\Query\Postgresql\Year
                MONTH: DoctrineExtensions\Query\Postgresql\Month
                DAY: DoctrineExtensions\Query\Postgresql\Day
                DATE: DoctrineExtensions\Query\Postgresql\Date
                HOUR: DoctrineExtensions\Query\Postgresql\Hour
                MINUTE: DoctrineExtensions\Query\Postgresql\Minute
                SECOND: DoctrineExtensions\Query\Postgresql\Second

            string_functions:
                STRPOS: DoctrineExtensions\Query\Postgresql\Strpos
                LOWER: DoctrineExtensions\Query\Postgresql\Lower
                UPPER: DoctrineExtensions\Query\Postgresql\Upper

            numeric_functions:
                RANDOM: DoctrineExtensions\Query\Postgresql\Random
                ROUND: DoctrineExtensions\Query\Postgresql\Round

        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Entity"
                prefix: 'App\Entity'
                alias: App

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
