services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - php
    networks:
      - app_network

  php:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    restart: always
    networks:
      - app_network

  db:
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
