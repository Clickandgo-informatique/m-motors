name: Deploy M-Motors (Production)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/m-motors

            echo "Sync repository..."
            git fetch origin
            git reset --hard origin/master
            git clean -fd

            echo "Rebuilding containers with PROD compose..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            echo "Symfony cache clear..."
            docker compose -f docker-compose.prod.yml exec -T php php bin/console cache:clear --env=prod

            echo "AssetMapper compile..."
            docker compose -f docker-compose.prod.yml exec -T php php bin/console asset-map:compile --env=prod
