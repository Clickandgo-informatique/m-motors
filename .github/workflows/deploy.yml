name: Deploy M-Motors (Production)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/m-motors

            echo "Sync repository..."
            git fetch origin
            git reset --hard origin/master

            echo "Rebuilding containers..."
            docker compose up -d --build

            echo "Symfony cache clear..."
            docker compose exec -T php bin/console cache:clear --env=prod

            echo "AssetMapper compile..."
            docker compose exec -T php bin/console asset-map:compile --env=prod
